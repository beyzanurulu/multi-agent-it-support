# k3s ships Traefik. DNS for helpdesk.<domain> is proxied by Cloudflare (orange cloud) and
# TLS uses a Cloudflare Origin Certificate stored as the `cloudflare-origin` secret:
#   kubectl -n helpdesk create secret tls cloudflare-origin --cert=origin.pem --key=origin.key
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helpdesk
  namespace: helpdesk
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts: [helpdesk.example.com]
      secretName: cloudflare-origin
  rules:
    - host: helpdesk.example.com
      http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend: {service: {name: grafana, port: {number: 3000}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: ui, port: {number: 8080}}}
