# In-cluster: scrape pods annotated with prometheus.io/scrape=true in the helpdesk namespace.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: helpdesk-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces: {names: [helpdesk]}
    relabel_configs:
      - {source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], action: keep, regex: "true"}
      - {source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path], target_label: __metrics_path__}
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - {source_labels: [__meta_kubernetes_pod_label_app], target_label: app}
