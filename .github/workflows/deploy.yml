name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [agent-api, mcp-tools, nlu-service, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/arm64  # Oracle Cloud Always Free Ampere VM
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
      - name: Pin image tags to this commit
        working-directory: deploy
        run: |
          for svc in agent-api mcp-tools nlu-service ui; do
            kustomize edit set image ${REGISTRY,,}/$svc=${REGISTRY,,}/$svc:${{ github.sha }}
          done
      - name: Apply manifests
        run: kubectl apply -k deploy/
      - name: Run migrations + seed
        run: |
          kubectl -n helpdesk delete job migrate --ignore-not-found
          sed "s#mcp-tools:latest#mcp-tools:${{ github.sha }}#" deploy/k8s/migrate-job.yaml \
            | kubectl apply -f -
          kubectl -n helpdesk wait --for=condition=complete job/migrate --timeout=300s
      - name: Wait for rollout
        run: |
          for d in mcp-tools nlu-service agent-api ui; do
            kubectl -n helpdesk rollout status deploy/$d --timeout=300s
          done
