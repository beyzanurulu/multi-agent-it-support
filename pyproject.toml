[project]
name = "multi-agent-it-support"
version = "0.1.0"
description = "Multi-agent IT support automation built on LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langsmith>=0.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "fastmcp>=4.1.3",
    "chromadb>=1.5.9",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "aiosqlite>=0.22.1",
    "fastapi>=0.159.1",
    "uvicorn[standard]>=0.54.0",
    "guardrails-ai>=0.11.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning:guardrails.*", "ignore::UserWarning:guardrails.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
